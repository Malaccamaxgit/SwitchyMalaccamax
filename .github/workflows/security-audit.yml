name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly security audit (every Monday at 9 AM UTC)
    - cron: '0 9 * * 1'

# Minimal permissions following principle of least privilege
permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: |
        echo "🔍 Running npm audit..."
        npm audit --production --audit-level=moderate || exit 1

    - name: Run secret scanner
      run: |
        echo "🔒 Scanning for exposed secrets..."
        node scripts/secret-scanner.js || exit 1

    - name: Run TypeScript type check
      run: |
        echo "🔧 Running TypeScript type check..."
        npm run typecheck

    - name: Run tests
      run: |
        echo "🧪 Running test suite..."
        npm test -- --run

    - name: Build extension
      run: |
        echo "📦 Building extension..."
        npm run build

    - name: Security summary
      if: success()
      run: |
        echo "✅ Security Audit Passed"
        echo ""
        echo "All security checks completed successfully:"
        echo "  ✓ No vulnerable dependencies"
        echo "  ✓ No exposed secrets"
        echo "  ✓ TypeScript types valid"
        echo "  ✓ Tests passing"
        echo "  ✓ Build successful"
